version: '3.8'

services:
  # Database Services
  postgres:
    image: postgres:15
    container_name: legal-automation-db
    environment:
      POSTGRES_DB: legal_automation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - legal-automation-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: legal-automation-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - legal-automation-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # AI Services
  ollama:
    image: ollama/ollama:latest
    container_name: legal-automation-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - legal-automation-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'

  # WAHA WhatsApp Service
  waha:
    image: devlikeapro/waha:latest
    container_name: legal-automation-waha
    environment:
      - WAHA_API_KEY=${WAHA_API_KEY:-your-api-key}
      - WAHA_SESSION=default
    volumes:
      - waha_data:/app/storage
    ports:
      - "3000:3000"
    networks:
      - legal-automation-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Application Services
  document-watcher:
    build:
      context: ./services/document-watcher
      dockerfile: Dockerfile
    container_name: legal-automation-document-watcher
    environment:
      - PYTHONPATH=/app
      - WATCH_FOLDER_1=${WATCH_FOLDER_1:-/app/watched}
      - WATCH_FOLDER_2=${WATCH_FOLDER_2:-/app/queue}
      - AI_PROCESSOR_URL=http://ai-processor:8002
      - VALIDATION_URL=http://validation-engine:8003
      - DRIVE_SERVICE_URL=http://google-drive-service:8004
      - NOTIFICATION_URL=http://notification-service:8005
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/legal_automation
      - LOG_LEVEL=INFO
    volumes:
      - ./watched:/app/watched
      - ./queue:/app/queue
    ports:
      - "8001:8001"
    networks:
      - legal-automation-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-processor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  ai-processor:
    build:
      context: ./services/ai-processor
      dockerfile: Dockerfile
    container_name: legal-automation-ai-processor
    environment:
      - PYTHONPATH=/app
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:70b}
      - OLLAMA_TIMEOUT=120
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/legal_automation
      - LOG_LEVEL=INFO
    ports:
      - "8002:8002"
    networks:
      - legal-automation-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: legal-automation-notification-service
    environment:
      - NODE_ENV=production
      - PORT=8005
      - WAHA_URL=http://waha:3000
      - WAHA_API_KEY=${WAHA_API_KEY:-your-api-key}
      - WAHA_SESSION=default
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    ports:
      - "8005:8005"
    networks:
      - legal-automation-network
    depends_on:
      redis:
        condition: service_healthy
      waha:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Monitoring Services
  prometheus:
    image: prom/prometheus:latest
    container_name: legal-automation-prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - legal-automation-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: legal-automation-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    networks:
      - legal-automation-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Validation Engine Service
  validation-engine:
    build:
      context: ./services/validation-engine
      dockerfile: Dockerfile
    container_name: legal-automation-validation-engine
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/legal_automation
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key}
      - LOG_LEVEL=INFO
    ports:
      - "8003:8003"
    networks:
      - legal-automation-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Google Drive Service
  google-drive-service:
    build:
      context: ./services/google-drive
      dockerfile: Dockerfile
    container_name: legal-automation-google-drive
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/legal_automation
      - REDIS_URL=redis://redis:6379
      - GOOGLE_CLIENT_SECRETS_FILE=/app/secrets/client_secrets.json
      - GOOGLE_SERVICE_ACCOUNT_KEY_PATH=/app/secrets/service_account.json
      - GOOGLE_CREDENTIALS_PATH=/app/secrets/token.json
      - ENABLE_VIRUS_SCAN=${ENABLE_VIRUS_SCAN:-false}
      - CLAMD_SOCKET=/tmp/clamd.socket
      - LOG_LEVEL=INFO
    ports:
      - "8004:8004"
    networks:
      - legal-automation-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/google-drive/secrets:/app/secrets:ro
      - drive_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Audit Service
  audit-service:
    build:
      context: ./services/audit-service
      dockerfile: Dockerfile
    container_name: legal-automation-audit-service
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/legal_automation
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - LOG_LEVEL=INFO
    ports:
      - "8005:8005"
    networks:
      - legal-automation-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Elasticsearch for Audit Service
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: legal-automation-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - legal-automation-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Web Dashboard
  web-dashboard:
    build:
      context: ./web-dashboard
      dockerfile: Dockerfile
    container_name: legal-automation-web-dashboard
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8001/api
    ports:
      - "3000:3000"
    networks:
      - legal-automation-network
    depends_on:
      - document-watcher
      - ai-processor
      - validation-engine
      - google-drive-service
      - audit-service
      - notification-service
    restart: unless-stopped

  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: legal-automation-api-gateway
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=8001
      - VALIDATION_SERVICE_URL=http://validation-engine:8003
      - DRIVE_SERVICE_URL=http://google-drive-service:8004
      - AUDIT_SERVICE_URL=http://audit-service:8005
      - AI_SERVICE_URL=http://ai-processor:8002
      - NOTIFICATION_SERVICE_URL=http://notification-service:8005
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET_KEY:-your-secret-key}
    ports:
      - "8001:8001"
    networks:
      - legal-automation-network
    depends_on:
      - validation-engine
      - google-drive-service
      - audit-service
      - ai-processor
      - notification-service
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  waha_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
  drive_uploads:

networks:
  legal-automation-network:
    driver: bridge