[tool:pytest]
# pytest configuration for AI-Driven Legal Document Automation System

# Test Discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output Configuration
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov=services
    --cov=shared
    --cov-fail-under=80
    --junit-xml=reports/junit.xml
    --html=reports/report.html
    --self-contained-html
    --maxfail=10
    --durations=10

# Markers (custom test markers)
markers =
    # Test Categories
    unit: Unit tests for individual components
    integration: Integration tests between components
    e2e: End-to-end tests of complete workflows
    security: Security-focused tests
    performance: Performance and load tests
    compliance: Compliance and regulatory tests

    # Service-Specific Tests
    validation_engine: Tests for validation engine service
    google_drive: Tests for Google Drive service
    audit_service: Tests for audit service
    notification_service: Tests for notification service
    ai_processor: Tests for AI processing service
    document_watcher: Tests for document watcher service
    web_dashboard: Tests for web dashboard

    # Feature-Specific Tests
    authentication: Authentication and authorization tests
    document_processing: Document processing pipeline tests
    compliance_validation: Compliance validation tests
    file_upload: File upload and handling tests
    ai_classification: AI document classification tests
    notification: Notification system tests

    # Test Priority and Environment
    critical: Critical tests that must pass
    smoke: Smoke tests for basic functionality
    regression: Regression tests for bug fixes
    slow: Slow-running tests (performance, load)
    external: Tests requiring external services

    # Document Types
    ktp: Tests specific to KTP document processing
    npwp: Tests specific to NPWP document processing
    akta: Tests specific to Akta document processing
    siup: Tests specific to SIUP document processing

    # Compliance Frameworks
    soc2: SOC2 Type II compliance tests
    gdpr: GDPR compliance tests
    indonesian_data: Indonesian data residency tests

    # Infrastructure Tests
    docker: Docker container tests
    kubernetes: Kubernetes deployment tests
    database: Database integration tests
    api: API endpoint tests
    websocket: WebSocket connection tests

# Minimum Version
minversion = 6.0

# Test Session Configuration
usefixtures =
    test_database
    test_redis
    mock_services

# Filtering
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Logging Configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Coverage Configuration
[coverage:run]
source = services, shared
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */migrations/*
    */venv/*
    */env/*
    */virtualenv/*
    */conftest.py
    setup.py
    */alembic/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov

# Async Configuration
asyncio_mode = auto

# Parallel Testing
# Note: Requires pytest-xdist
# Command line: pytest -n auto

# Timeout Configuration (requires pytest-timeout)
timeout = 300  # 5 minutes default timeout
timeout_method = thread

# Benchmark Configuration (requires pytest-benchmark)
benchmark_sort = min
benchmark_time_unit = millisecond
benchmark_columns = min, max, mean, median, stddev, rounds, iterations

# Security Configuration (requires bandit)
bandit.ini = .bandit

# Performance Configuration (requires memory-profiler)
memprof-top-scale = 2.0

# Environment Variables
env =
    TESTING = true
    PYTHONPATH = .
    DATABASE_URL = postgresql://test:test@localhost/test_db
    REDIS_URL = redis://localhost:6379/1

# Docker Testing Configuration
docker-compose = docker-compose.test.yml
docker-compose-project = legal-automation-test

# Reporting Configuration
json-report = reports/report.json
json-report-file = reports/report.json